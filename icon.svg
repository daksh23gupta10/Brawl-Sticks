<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1b38"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowMag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Energy Clash Circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffd700" stroke-width="3" stroke-dasharray="12 16" opacity="0.6"/>

  <!-- Blue Fighter (Left) -->
  <g filter="url(#glowCyan)" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="180" r="28" fill="#00f0ff"/>
    <line x1="170" y1="208" x2="190" y2="310"/>
    <!-- Legs -->
    <line x1="190" y1="310" x2="140" y2="410"/>
    <line x1="190" y1="310" x2="220" y2="400"/>
    <!-- Punching Arm -->
    <line x1="175" y1="235" x2="245" y2="245"/>
    <line x1="175" y1="235" x2="135" y2="280"/>
  </g>

  <!-- Magenta Fighter (Right) -->
  <g filter="url(#glowMag)" stroke="#ff0055" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="342" cy="180" r="28" fill="#ff0055"/>
    <line x1="342" y1="208" x2="322" y2="310"/>
    <!-- Legs -->
    <line x1="322" y1="310" x2="372" y2="410"/>
    <line x1="322" y1="310" x2="292" y2="400"/>
    <!-- Guarding / Kick Arm -->
    <line x1="337" y1="235" x2="265" y2="250"/>
    <line x1="337" y1="235" x2="377" y2="280"/>
  </g>

  <!-- Impact Sparks in Center -->
  <circle cx="256" cy="248" r="18" fill="#ffd700"/>
  <path d="M 256 220 L 260 244 L 284 248 L 260 252 L 256 276 L 252 252 L 228 248 L 252 244 Z" fill="#ffffff"/>
</svg>
